# =====================================================================
# 本地/演示环境编排：MySQL + Redis + pgvector + AI 服务
#
#   1) cp .env.example .env  并填写（mock 模式无需任何 Key）
#   2) docker compose up -d
#   3) 业务后端在宿主机跑： cd backend && mvn spring-boot:run
#
# 镜像前缀说明：
#   国内网络拉取 Docker Hub 失败时，在 .env 中加一行
#       DOCKER_MIRROR=docker.m.daocloud.io
#   即可自动切换到镜像站；海外环境保持默认 docker.io 即可。
# =====================================================================
name: library-ai

services:
  mysql:
    image: ${DOCKER_MIRROR:-docker.io}/library/mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-library_root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-library_db}
      TZ: Asia/Shanghai
    ports:
      # 宿主机用 3307，避免和本机已有 MySQL 冲突
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-library_root_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    # 默认 redis:7-alpine：会话历史 / 确认状态 / 语义缓存都够用。
    # 若要启用 Redis 版 LangGraph checkpointer（跨重启恢复对话上下文与中断暂停态），
    # 换成自带 RedisJSON + RediSearch 的 Redis Stack，下面这行替换 image 即可：
    #   image: ${DOCKER_MIRROR:-docker.io}/redis/redis-stack-server:7.2.0-v11
    image: ${DOCKER_MIRROR:-docker.io}/library/redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgvector:
    image: ${DOCKER_MIRROR:-docker.io}/pgvector/pgvector:pg16
    container_name: library-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-library_ai}
      POSTGRES_USER: ${PGVECTOR_USER:-library}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-library}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-library} -d ${PGVECTOR_DB:-library_ai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: library-ai-service:w1
    container_name: library-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内访问宿主机上的 Spring Boot
      JAVA_API_BASE: http://host.docker.internal:18080
      AI_REDIS_URL: redis://redis:6379/1
      PGVECTOR_DSN: postgresql://${PGVECTOR_USER:-library}:${PGVECTOR_PASSWORD:-library}@pgvector:5432/${PGVECTOR_DB:-library_ai}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ai/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---- Langfuse 全链路追踪（W4-1，默认不启动）----
  # 用法：
  #   1) 在 pgvector 里建库：docker compose exec pgvector psql -U library -d library_ai -c "CREATE DATABASE langfuse;"
  #   2) docker compose --profile observability up -d langfuse
  #   3) 打开 http://127.0.0.1:3000 注册账号 → 创建 project 拿 public/secret key
  #   4) 写入 .env：LANGFUSE_ENABLED=true / LANGFUSE_HOST=http://127.0.0.1:3000 / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY
  #   5) 重启 AI 服务：bash scripts/dev_down.sh && bash scripts/dev_up.sh
  # 说明：Langfuse v2 只需要 Postgres；本机 Docker 拉镜像受限时未做真机验证（见 docs/可观测性说明.md）
  langfuse:
    image: ${DOCKER_MIRROR:-docker.io}/langfuse/langfuse:2
    container_name: library-langfuse
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${PGVECTOR_USER:-library}:${PGVECTOR_PASSWORD:-library}@pgvector:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-secret-please-change}
      SALT: ${LANGFUSE_SALT:-local-dev-salt-please-change}
      NEXTAUTH_URL: http://127.0.0.1:3000
      TELEMETRY_ENABLED: "false"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  pgvector-data:
