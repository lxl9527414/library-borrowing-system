server {
    listen 80;
    listen [::]:80;
    server_name lxlssr.icu;

    access_log /var/log/nginx/lxlssr.icu.access.log main;
    error_log /var/log/nginx/lxlssr.icu.error.log warn;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # AI 服务（Python/FastAPI）。部署 AI 服务后启用本段；未部署时可整段注释。
    # 注意：SSE 流式必须关闭缓冲，否则前端会"等一大段再一起出现"，失去打字机效果。
    #   systemd 启动示例：见 deploy/README.md 的 library-ai.service 说明
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;   # LLM 流式响应可能持续较久
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # 内部工具接口只给 AI 服务调用，禁止公网直接访问（双重防护之一，另一个是 X-Internal-Token）
    location /api/ai/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
