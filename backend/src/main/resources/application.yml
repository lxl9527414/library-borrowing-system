server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful

spring:
  application:
    name: library-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/library_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 30000
      test-while-idle: true
      validation-query: SELECT 1
      # 监控统计 + SQL 防火墙 + 日志
      filters: stat,wall,slf4j
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.css,*.png,*.jpg,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_CONSOLE_USER:admin}
        login-password: ${DRUID_CONSOLE_PASSWORD:admin123}
        reset-enable: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  auth:
    token-ttl: ${TOKEN_TTL:604800}
    token-prefix: "library:token:"
  ai:
    # AI 服务调用内部工具接口所需的共享密钥；留空表示开发期不校验
    internal-token: ${AI_INTERNAL_TOKEN:}
    # 内部工具接口路径前缀（生产环境 nginx 不应对外暴露此路径）
    internal-path-prefix: /api/ai/internal/

logging:
  level:
    com.library: info
    com.library.mapper: warn
